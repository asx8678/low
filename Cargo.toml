[package]
name = "low"
version = "0.1.18"
edition = "2024"
rust-version = "1.99"
description = "A low-entropy, code-mode coding agent: one sandboxed Python tool, verified diffs, git as the undo"
license = "MIT"
repository = "https://github.com/asx8678/low"
readme = "README.md"
keywords = ["agent", "llm", "coding-agent", "cli", "sandbox"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
httpdate = "1.0.3"
lexopt = "0.3.2"
libc = "0.2.190"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustix = { version = "1.1.5", features = ["process", "termios", "stdio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustyline = { version = "18.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "rt", "signal", "time"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
unicode-width = "0.2.2"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

# What dist builds the release binaries with: the release profile as it is.
[profile.dist]
inherits = "release"
